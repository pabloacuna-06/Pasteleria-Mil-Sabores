cto-stock-critico" class="field-error"></p></div><div class="field"><label for="producto-categoria">Categoría</label><select id="producto-categoria" name="categoria"><option value="">Seleccione</option></select><p id="error-producto-categoria" class="field-error"></p></div><div class="field"><label for="producto-imagen">URL de imagen</label><input id="producto-imagen" name="imagen" type="url"><p id="error-producto-imagen" class="field-error"></p></div><button>Guardar</button><p id="mensaje-producto-admin" class="form-message"></p></form></section></main></body></html>
